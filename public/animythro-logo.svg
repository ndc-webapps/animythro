<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" fill="none">
  <defs>
    <linearGradient id="am-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="35%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="am-grad-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="55%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="am-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="am-softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- ===== Torii Gate ===== -->
  <g filter="url(#am-glow)">
    <path d="M44 56 Q150 26 256 56 L248 72 Q150 46 52 72 Z" fill="url(#am-grad-v)"/>
    <rect x="66" y="84" width="168" height="16" rx="4" fill="url(#am-grad-v)"/>
    <rect x="84" y="92" width="20" height="92" rx="4" fill="url(#am-grad-v)"/>
    <rect x="196" y="92" width="20" height="92" rx="4" fill="url(#am-grad-v)"/>
    <rect x="78" y="176" width="32" height="12" rx="3" fill="url(#am-grad-v)"/>
    <rect x="190" y="176" width="32" height="12" rx="3" fill="url(#am-grad-v)"/>
    <rect x="134" y="96" width="32" height="56" rx="4" fill="#160826" stroke="url(#am-grad-v)" stroke-width="3"/>
    <text x="150" y="118" font-family="'Yu Gothic','Noto Sans JP',sans-serif" font-size="18" font-weight="700" fill="#f0abfc" text-anchor="middle">神</text>
    <text x="150" y="142" font-family="'Yu Gothic','Noto Sans JP',sans-serif" font-size="18" font-weight="700" fill="#7dd3fc" text-anchor="middle">話</text>
  </g>

  <!-- ===== Wordmark (textLength locks width so it never clips) ===== -->
  <text x="296" y="138" textLength="510" lengthAdjust="spacingAndGlyphs"
    font-family="'Arial Black','Arial Bold',Arial,sans-serif" font-size="88" font-weight="900"
    fill="url(#am-grad)" filter="url(#am-glow)">ANIMYTHRO</text>

  <!-- underline swoosh -->
  <path d="M300 158 Q540 180 810 150" stroke="url(#am-grad)" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#am-glow)"/>

  <!-- ===== Sparkles ===== -->
  <g fill="#e879f9" filter="url(#am-softglow)">
    <path d="M272 64 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z"/>
    <path d="M40 150 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 z"/>
  </g>
  <g fill="#7dd3fc" filter="url(#am-softglow)">
    <path d="M790 58 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z"/>
    <path d="M255 170 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z"/>
  </g>
</svg>
