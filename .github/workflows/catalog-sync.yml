name: Catalog Sync

# Pulls fresh anime playlists from the approved YouTube channels, removes
# members-only / dead videos, and opens a Pull Request with the diff.
# You review the PR and click Merge — nothing touches `main` automatically.

on:
  schedule:
    - cron: '0 6 * * 1'        # every Monday 06:00 UTC
  workflow_dispatch: {}         # lets you run it manually from the Actions tab

permissions:
  contents: write               # commit the catalog changes to a branch
  pull-requests: write          # open the PR

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Install deps
        run: npm ci

      - name: Discover new anime
        run: node scripts/discover-new-anime.mjs

      - name: Purge members-only / dead videos
        run: node scripts/purge-members-only.mjs

      - name: Open Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: catalog-sync/auto
          commit-message: 'chore(catalog): automated sync'
          title: 'Catalog sync — automated update'
          body: |
            Automated catalog refresh.

            - Pulled new playlists from approved channels (`lib/channel-sources.ts`)
            - Removed members-only / private / deleted videos
            - Files changed: `lib/expanded-catalog.json`, `lib/expanded-playlists.json`

            Review the diff, then merge if it looks right.
          add-paths: |
            lib/expanded-catalog.json
            lib/expanded-playlists.json
